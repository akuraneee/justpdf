name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  BUILD_TOOLS: 36.0.0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: third_party/pdfium
          key: pdfium-linux-${{ hashFiles('scripts/fetch-pdfium.sh') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and PDFium integration tests
        run: |
          scripts/fetch-pdfium.sh linux-x64
          python3 scripts/make-test-pdf.py "$RUNNER_TEMP/test.pdf" 60
          export PDFIUM_PATH="$PWD/third_party/pdfium/linux-x64/lib/libpdfium.so"
          export JUSTPDF_TEST_PDF="$RUNNER_TEMP/test.pdf"
          cargo test --release

  apk:
    name: APK
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version code = commit count
      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="$base-build.$GITHUB_RUN_NUMBER"
            tag="build-$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: third_party/pdfium
          key: pdfium-android-${{ hashFiles('scripts/fetch-pdfium.sh') }}
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "build-tools;$BUILD_TOOLS" "platforms;android-36" "ndk;$NDK_VERSION" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "JUSTPDF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set: APKs are signed with a throwaway debug key, so each build needs a reinstall."
          fi
      - name: Build APKs
        env:
          JUSTPDF_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          JUSTPDF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JUSTPDF_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: justpdf-apks
          path: build/out/*.apk
          if-no-files-found: error

  # Every green build of main becomes a GitHub release (tag build-N);
  # pushing a v* tag publishes that version instead.
  release:
    name: Release
    needs: [test, apk]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: justpdf-apks
          path: apks
      - name: Release notes
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "Automatic build of \`${GITHUB_SHA::7}\`${COMMIT_MESSAGE:+: ${COMMIT_MESSAGE%%$'\n'*}}"
            echo
            echo "**Which APK to install?**"
            echo "- \`justpdf-arm64-v8a.apk\`: almost every phone from the last ~8 years"
            echo "- \`justpdf-armeabi-v7a.apk\`: old 32-bit phones"
            echo "- \`justpdf-x86_64.apk\`: emulators and Chromebooks"
            echo "- \`justpdf-universal.apk\`: all of the above in one (bigger) file"
          } > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.apk.outputs.tag }}
          name: JustPDF ${{ needs.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          generate_release_notes: true
          make_latest: true
          files: apks/*.apk
          fail_on_unmatched_files: true
