name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  BUILD_TOOLS: 35.0.0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: third_party/pdfium
          key: pdfium-linux-${{ hashFiles('scripts/fetch-pdfium.sh') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and PDFium integration tests
        run: |
          scripts/fetch-pdfium.sh linux-x64
          python3 scripts/make-test-pdf.py "$RUNNER_TEMP/test.pdf" 60
          export PDFIUM_PATH="$PWD/third_party/pdfium/linux-x64/lib/libpdfium.so"
          export JUSTPDF_TEST_PDF="$RUNNER_TEMP/test.pdf"
          cargo test --release

  apk:
    name: APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version code = commit count
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: third_party/pdfium
          key: pdfium-android-${{ hashFiles('scripts/fetch-pdfium.sh') }}
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "build-tools;$BUILD_TOOLS" "platforms;android-35" "ndk;$NDK_VERSION" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "JUSTPDF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set: APKs are signed with a throwaway debug key, so each build needs a reinstall."
          fi
      - name: Build APKs
        env:
          JUSTPDF_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          JUSTPDF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JUSTPDF_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: justpdf-apks
          path: build/out/*.apk
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/out/*.apk
          generate_release_notes: true
